<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="404.css">
<title>404 :c</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background: url("assets/black.png") center/cover no-repeat;
    font-family: "Chillax", sans-serif;
}

.nav {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 50px;
    z-index: 100;
}

.top-button {
    color: #bdbdbd;
    text-decoration: none;
    font-size: 18px;
    transition: .2s;
}

.top-button:hover {
    color: white;
    transform: scale(1.12);
}

.top-button.active {
    color: #7dd3fc;
}

img {
    width: 200px;
    max-width: 90vw;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
    transform: translateY(-130px);
}

.text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

.text h1 {
    font-size: 90px;
    text-shadow:
        0 0 10px rgba(255,255,255,0.6),
        0 0 25px rgba(255,255,255,0.3);
}

.text p {
    font-size: 32px;
    opacity: 0.7;
    margin-top: 5px;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.return-btn {
    display: inline-block;
    margin-top: 25px;
    font-size: 20px;
    color: #bdbdbd;
    text-decoration: none;
    transition: all 0.2s ease;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.return-btn:hover {
    color: #ffffff;
    transform: scale(1.08);
    text-shadow: 0 0 15px rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<div class="text">
    <h1>404</h1>
    <p>this page doesn’t exist</p>
    <a href="/" class="return-btn">return</a>
</div>

</body>
</html>
