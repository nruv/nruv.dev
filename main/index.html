<div class="clock-area">

    <div class="clock-block">
        <div class="clock">
            <div class="hand hour" id="hour"></div>
            <div class="hand min" id="min"></div>
            <div class="hand sec" id="sec"></div>
        </div>

        <div id="text-time"></div>
    </div>

    <div class="discord-block">
        <div class="discord-status">
            <img
                src="https://lanyard.cnrad.dev/api/141234854837616641?bg=00000000&showDisplayName=true"
                alt="Discord Status">
        </div>
    </div>

</div>

    <img src="assets/sad.gif" alt="gif">
</div>

<script>
function updateClock() {
    const now = new Date();

    const uk = new Date(
        now.toLocaleString("en-US", { timeZone: "Europe/London" })
    );

    const sec = uk.getSeconds();
    const min = uk.getMinutes();
    const hour = uk.getHours();

    const secDeg = sec * 6;
    const minDeg = min * 6 + sec * 0.1;
    const hourDeg = (hour % 12) * 30 + min * 0.5;

    document.getElementById("sec").style.transform =
        `translateX(-50%) rotate(${secDeg}deg)`;

    document.getElementById("min").style.transform =
        `translateX(-50%) rotate(${minDeg}deg)`;

    document.getElementById("hour").style.transform =
        `translateX(-50%) rotate(${hourDeg}deg)`;
}

function updateTextTime() {
    const now = new Date();

    const uk = new Date(
        now.toLocaleString("en-US", { timeZone: "Europe/London" })
    );

    const h = String(uk.getHours()).padStart(2, "0");
    const m = String(uk.getMinutes()).padStart(2, "0");
    const s = String(uk.getSeconds()).padStart(2, "0");

    document.getElementById("text-time").textContent =
        `${h}:${m}:${s}`;
}

updateClock();
setInterval(updateClock, 1000);

updateTextTime();
setInterval(updateTextTime, 1000);
</script>
