<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="style.css">

<link rel="icon" type="image/png" href="assets/icon.png">

<body>

<div id="cursor-trail-container"></div>
<div id="cursor-glow"></div>

<div id="entry">
    <div class="entry-box">
        click to enter...
    </div>
</div>

<div class="stars" id="stars">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
</div>

<audio id="bgm" src="assets/music.mp3" loop></audio>

<div class="card" id="mainContent">

    <img class="pfp" src="assets/avatar.png">

    <div class="name-area">
        <h1 class="light-sweep">nruv</h1>

    <p id="typing"></p>

    <div class="badges">

        <div class="badge" data-tooltip="Staff">
            <img src="assets/staff.png">

    </div>

    <div class="lanyard">
        <iframe
            src="https://lanyard.cnrad.dev/api/141234854837616641?bg=00000000&hideBadges=true&hideActivity=true&showDisplayName=true&hideSpotify=true&hideTag=true"
            frameborder="0"
            scrolling="no">
        </iframe>
    </div>

    <div class="social">

        <button class="nav" id="left" onclick="move(-1)">&lt;</button>

        <div class="viewport">
            <div class="track" id="track">

                <div class="page">
                    <a href="https://tiktok.com/@78o" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="https://discord.com/users/141234854837616641" target="_blank"><i class="fa-brands fa-discord"></i></a>
                    <a href="https://instagram.com/petpl_yer" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                </div>

                <div class="page">
                    <a href="https://t.me/petpl_yer" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                    <a href="https://www.last.fm/user/autopsy9" target="_blank"><i class="fa-brands fa-lastfm"></i></a>
                    <a href="https://x.com/interpolHater" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                </div>

            </div>
        </div>

        <button class="nav" id="right" onclick="move(1)">&gt;</button>
    </div>

    <button id="muteBtn" class="mute-btn">
        <img id="muteIcon" src="assets/unmuted.png">
    </button>

</div>

<script>
const text = "nruv.dev";
let i = 0;
let direction = 1;

function animateTitle() {
    document.title = text.substring(0, i);

    i += direction;

    if (i > text.length) {
        i = text.length;
        direction = -1;
        setTimeout(animateTitle, 900);
        return;
    }

    if (i < 1) {
        i = 1;
        direction = 1;
        setTimeout(animateTitle, 500);
        return;
    }

    setTimeout(animateTitle, 180);
}
animateTitle();
</script>

<script>
let page = 0;
const track = document.getElementById("track");
const pages = document.querySelectorAll(".page").length;

function move(dir) {
    page += dir;
    if (page < 0) page = 0;
    if (page > pages - 1) page = pages - 1;
    track.style.transform = `translateX(-${page * 200}px)`;
}
</script>

<script>
const entry = document.getElementById("entry");
const audio = document.getElementById("bgm");
const btn = document.getElementById("muteBtn");
const icon = document.getElementById("muteIcon");

audio.volume = 0.15;

entry.addEventListener("click", () => {
    entry.style.opacity = "0";

    setTimeout(() => {
        entry.style.display = "none";
    }, 600);

    audio.play();
});

btn.addEventListener("click", () => {
    audio.muted = !audio.muted;
    icon.src = audio.muted
        ? "assets/muted.png"
        : "assets/unmuted.png";
});
</script>


<script>
const phrases = [
    "i do stuff",
    "i@nruv.dev",
];

const typing = document.getElementById("typing");

let phrase = 0;
let letter = 0;
let deleting = false;

function typeWriter() {
    const current = phrases[phrase];

    if (!deleting) {
        typing.textContent = current.substring(0, letter);
        letter++;

        if (letter > current.length) {
            deleting = true;
            setTimeout(typeWriter, 1800);
            return;
        }
    } else {
        typing.textContent = current.substring(0, letter);
        letter--;

        if (letter < 0) {
            deleting = false;
            phrase = (phrase + 1) % phrases.length;
            letter = 0;
            setTimeout(typeWriter, 300);
            return;
        }
    }

    setTimeout(typeWriter, deleting ? 40 : 80);
}

typeWriter();
</script>


<script>
const cursorGlow = document.getElementById("cursor-glow");
const trailContainer = document.getElementById("cursor-trail-container");

let lastX = null;
let lastY = null;
let mouseStarted = false;

document.addEventListener("mousemove", (e) => {
    const x = e.clientX;
    const y = e.clientY;

    if (!mouseStarted) {
        mouseStarted = true;
        cursorGlow.style.display = "block";
        cursorGlow.style.left = x + "px";
        cursorGlow.style.top = y + "px";
        lastX = x;
        lastY = y;
        return;
    }

    cursorGlow.style.left = x + "px";
    cursorGlow.style.top = y + "px";

    const distance = Math.hypot(x - lastX, y - lastY);

    const steps = Math.max(1, Math.floor(distance / 4));

    for (let i = 1; i <= steps; i++) {
        const trail = document.createElement("div");
        trail.className = "cursor-trail";

        const trailX = lastX + (x - lastX) * (i / steps);
        const trailY = lastY + (y - lastY) * (i / steps);

        trail.style.left = trailX + "px";
        trail.style.top = trailY + "px";

        trailContainer.appendChild(trail);

        setTimeout(() => {
            trail.remove();
        }, 500);
    }

    lastX = x;
    lastY = y;
});

document.addEventListener("mouseleave", () => {
    cursorGlow.style.opacity = "0";
});

document.addEventListener("mouseenter", () => {
    if (mouseStarted) {
        cursorGlow.style.opacity = "1";
    }
});
</script>
</body>
</html>
